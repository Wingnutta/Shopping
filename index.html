<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Shopping</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lists.css">
  <link rel="stylesheet" href="trip.css">
</head>
<body>
  <header class="app-header">
    <button id="back-btn" class="back-btn" type="button" aria-label="Back" hidden>←</button>
    <!-- Round initial of the supermarket; shown on the supermarket and trip screens (app.js). -->
    <span id="app-badge" class="app-badge" aria-hidden="true" hidden></span>
    <h1 id="app-title">Shopping</h1>
  </header>

  <main>
    <!-- Screen 1: supermarkets -->
    <section id="home-view" aria-labelledby="stores-title">
      <h2 id="stores-title">Supermarkets</h2>

      <form id="add-form" autocomplete="off">
        <!-- Options come from supermarkets.js (filled in by app.js); "Other…" shows the name box. -->
        <select id="store-chain" aria-label="Choose a supermarket">
          <option value="">Choose a supermarket…</option>
          <option value="other">Other…</option>
        </select>
        <input id="store-name" type="text" placeholder="Shop name"
               maxlength="40" aria-label="Supermarket name" hidden>
        <button type="submit">Add</button>
      </form>
      <p id="form-error" class="error" role="alert" hidden></p>

      <ul id="store-list" class="card-list"></ul>
      <p id="empty-state" class="empty" hidden>No supermarkets yet. Add the first one above.</p>
    </section>

    <!-- Screen 2: everything she buys at one supermarket (the master list) -->
    <section id="list-view" aria-labelledby="list-title" hidden>
      <h2 id="list-title">Shopping list</h2>

      <button id="newlist-btn" class="newlist-btn" type="button">New list</button>

      <form id="item-form" autocomplete="off" style="margin-top:14px">
        <input id="item-name" type="text" placeholder="Add an item (e.g. Milk)"
               maxlength="60" required aria-label="Item name">
        <button type="submit">Add</button>
      </form>
      <p id="item-error" class="error" role="alert" hidden></p>

      <div class="list-toolbar">
        <span id="list-count" class="list-progress"></span>
        <button id="arrange-btn" class="tool-btn" type="button" aria-pressed="false">Arrange</button>
      </div>

      <ul id="item-list" class="item-list"></ul>
      <p id="item-empty" class="empty" hidden>No items yet. Add the first one above.</p>
    </section>

    <!-- Screen 3: the temporary list for one visit to that supermarket -->
    <section id="trip-view" aria-labelledby="trip-title" hidden>
      <h2 id="trip-title">List for this trip</h2>

      <div class="list-toolbar">
        <span id="trip-progress" class="list-progress"></span>
        <button id="choose-btn" class="tool-btn" type="button" aria-pressed="false">Choose items</button>
        <button id="trip-reset-btn" class="tool-btn" type="button">Reset</button>
      </div>
      <div class="list-toolbar">
        <button id="add-all-btn" class="tool-btn" type="button" hidden>Add all</button>
      </div>

      <ul id="trip-list" class="item-list"></ul>
      <p id="trip-empty" class="empty" hidden></p>
      <p id="trip-all-done" class="empty" hidden>Everything is in the trolley. 🎉</p>
    </section>
  </main>

  <script src="supermarkets.js"></script>
  <script src="store.js"></script>
  <script src="lists.js"></script>
  <script src="trip.js"></script>
  <script src="app.js"></script>
</body>
</html>
