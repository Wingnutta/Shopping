<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Shopping</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lists.css">
</head>
<body>
  <header class="app-header">
    <button id="back-btn" class="back-btn" type="button" aria-label="Back to supermarkets" hidden>←</button>
    <h1 id="app-title">Shopping</h1>
  </header>

  <main>
    <!-- Screen 1: supermarkets -->
    <section id="home-view" aria-labelledby="stores-title">
      <h2 id="stores-title">Supermarkets</h2>

      <form id="add-form" autocomplete="off">
        <input id="store-name" type="text" placeholder="Add a supermarket (e.g. Mercadona)"
               maxlength="40" required aria-label="Supermarket name">
        <button type="submit">Add</button>
      </form>
      <p id="form-error" class="error" role="alert" hidden></p>

      <ul id="store-list" class="card-list"></ul>
      <p id="empty-state" class="empty" hidden>No supermarkets yet. Add the first one above.</p>
    </section>

    <!-- Screen 2: the shopping list of one supermarket -->
    <section id="list-view" aria-labelledby="list-title" hidden>
      <h2 id="list-title">Shopping list</h2>

      <form id="item-form" autocomplete="off">
        <input id="item-name" type="text" placeholder="Add an item (e.g. Milk)"
               maxlength="60" required aria-label="Item name">
        <button type="submit">Add</button>
      </form>
      <p id="item-error" class="error" role="alert" hidden></p>

      <div class="list-toolbar">
        <span id="list-progress" class="list-progress"></span>
        <button id="arrange-btn" class="tool-btn" type="button" aria-pressed="false">Arrange</button>
        <button id="reset-btn" class="tool-btn" type="button">Reset</button>
      </div>

      <ul id="item-list" class="item-list"></ul>
      <p id="item-empty" class="empty" hidden>No items yet. Add the first one above.</p>
      <p id="item-all-done" class="empty" hidden>Everything is in the trolley. 🎉</p>
    </section>
  </main>

  <script src="store.js"></script>
  <script src="lists.js"></script>
  <script src="app.js"></script>
</body>
</html>
