<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <title>Shopping</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Shopping</h1>
  </header>

  <main>
    <section aria-labelledby="stores-title">
      <h2 id="stores-title">Supermarkets</h2>

      <form id="add-form" autocomplete="off">
        <input id="store-name" type="text" placeholder="Add a supermarket (e.g. Mercadona)"
               maxlength="40" required aria-label="Supermarket name">
        <button type="submit">Add</button>
      </form>
      <p id="form-error" class="error" role="alert" hidden></p>

      <ul id="store-list" class="card-list"></ul>
      <p id="empty-state" class="empty" hidden>No supermarkets yet. Add the first one above.</p>
    </section>
  </main>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
